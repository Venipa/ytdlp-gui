[package]
name = "ytdlpd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The embedded yt-dlp engine. Does nothing yet; `--no-default-features` builds against the fake
# backend with no Python (D-043).
default = ["real-engine"]
real-engine = []

[dependencies]
anyhow.workspace = true
cli.workspace = true
clap.workspace = true
env_logger.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
i18n.workspace = true
icons.workspace = true
input.workspace = true
log.workspace = true
notify-rust.workspace = true
router.workspace = true
storage.workspace = true
ui.workspace = true
views.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security"] }

[build-dependencies]
embed.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
