[package]
name = "ytdlpd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The embedded yt-dlp engine (links the PBS libpython, run `bun run setup` first).
# `--no-default-features` builds against the fake backend with no Python (D-043).
default = ["real-engine"]
real-engine = ["dep:engine"]

[dependencies]
anyhow.workspace = true
cli.workspace = true
clap.workspace = true
engine = { workspace = true, optional = true }
env_logger.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
i18n.workspace = true
icons.workspace = true
input.workspace = true
log.workspace = true
notify-rust.workspace = true
router.workspace = true
domain.workspace = true
storage.workspace = true
state.workspace = true
serde_json.workspace = true
ui.workspace = true
views.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security"] }

[build-dependencies]
embed.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
