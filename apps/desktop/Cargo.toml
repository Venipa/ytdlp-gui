[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.20"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/venipa/ytdlpd"

[workspace.dependencies]
bridge = { path = "crates/bridge" }
cli = { path = "crates/cli" }
domain = { path = "crates/domain" }
embed = { path = "crates/embed" }
engine = { path = "crates/engine" }
i18n = { path = "crates/i18n" }
icons = { path = "crates/icons" }
input = { path = "crates/input" }
router = { path = "crates/router" }
state = { path = "crates/state" }
storage = { path = "crates/storage" }
tools = { path = "crates/tools" }
ui = { path = "crates/ui" }
views = { path = "crates/views" }

# lane D: browser extension bridge
base64 = "0.22"
getrandom = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }

anyhow = "1.0"
ashpd = { version = "0.14", default-features = false, features = [
    "async-io",
    "inhibit",
    "settings",
] }
block2 = "0.6"
clap = { version = "4", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
clap_complete = "4.6"
dirs = "7"
env_logger = "0.11"
flate2 = "1"
fluent-bundle = "0.16"
futures = "0.3"
gpui = { path = "../../packages/gpui/crates/gpui" }
gpui_platform = { path = "../../packages/gpui/crates/gpui_platform", features = [
    "font-kit",
    "wayland",
    "x11",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
interprocess = "2.4"
jiff = { version = "0.2", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-bundle-platform",
    "tzdb-zoneinfo",
] }
ksni = { version = "0.3", default-features = false, features = [
    "async-io",
    "blocking",
] }
libc = "0.2"
liblzma = { version = "0.4", features = ["static"] }
log = "0.4"
notify = "8.2"
notify-rust = "4.19"
objc2 = "0.6"
open = "5.4"
pyo3 = { version = "0.30", default-features = false, features = ["macros"] }
qrcodegen = "1"
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls-no-provider",
    "stream",
] }
resvg = { version = "0.49", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11"
shlex = "2"
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
sys-locale = "0.3"
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "process",
    "sync",
    "time",
] }
tray-icon = { version = "0.26", default-features = false }
unic-langid = { version = "0.9", features = ["macros"] }
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
url = "2"
regex = "1"
widestring = "1.2"
winresource = "0.1"
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
zbus = { version = "6", default-features = false, features = [
    "proxy",
    "tokio",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusItem",
    "NSWorkspace",
] }

[workspace.lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
dbg_macro = "warn"
empty_drop = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
inefficient_to_string = "warn"
set_contains_or_insert = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
large_stack_frames = "warn"
or_fun_call = "warn"
large_types_passed_by_value = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.ui]
debug = false
opt-level = 2

[profile.dev.package.views]
debug = false
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2

# The profile `dx serve --hot-patch` builds in. The crates edited while hot reloading build
# unoptimised: an optimised crate recompiles slowly on every save, and its internalised symbols
# break the patch link ("undefined symbol: anon.*.llvm.*").
[profile.desktop-dev]
inherits = "dev"

[profile.desktop-dev.package.views]
opt-level = 0

[profile.desktop-dev.package.ui]
opt-level = 0

[profile.desktop-dev.package.state]
opt-level = 0

[profile.desktop-dev.package.router]
opt-level = 0

[profile.desktop-dev.package.input]
opt-level = 0

[profile.desktop-dev.package.ytdlpd]
opt-level = 0
