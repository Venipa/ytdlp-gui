name: ci

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "apps/web/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["**/*.md", "apps/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # line tables keep backtraces readable but skip full debug info: much faster links, smaller cache
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

defaults:
  run:
    working-directory: apps/desktop

jobs:
  lint:
    name: fmt and clippy (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: lint
          # only master runs refresh the cache; PRs reuse it
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@v2
      # python-build-standalone runtime + pyo3.cfg (the `real-engine` feature links libpython)
      - run: bun scripts/setup.ts
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-windows:
    name: tests (windows)
    runs-on: windows-latest
    env:
      # rust-lld links the many gpui-sized test binaries much faster than MSVC link.exe
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v7
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: test-windows
          # only master runs refresh the cache; PRs reuse it
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@v2
      # python-build-standalone runtime + pyo3.cfg (the `real-engine` feature links libpython)
      - run: bun scripts/setup.ts
      # the engine tests re-exec the `fetch` example as their worker: build just that one normally
      - run: cargo build -p engine --example fetch --locked
      # libs, bins and tests only: the other examples are checked by clippy on the other jobs, not linked here
      - run: cargo test --workspace --locked --lib --bins --tests

  clippy-macos:
    name: clippy (macos)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: clippy-macos
          # only master runs refresh the cache; PRs reuse it
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@v2
      # python-build-standalone runtime + pyo3.cfg (the `real-engine` feature links libpython)
      - run: bun scripts/setup.ts
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
