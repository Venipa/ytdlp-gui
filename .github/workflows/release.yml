name: release

# Tag vX.Y.Z builds the six installers and attaches them to a GitHub release (draft).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: apps/desktop

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, script: pwsh scripts/package-windows.ps1 -Arch x64, glob: "dist/*-setup.exe" }
          - { name: windows-arm64, os: windows-11-arm, script: pwsh scripts/package-windows.ps1 -Arch arm64, glob: "dist/*-setup.exe" }
          - { name: macos-arm64, os: macos-15, script: bash scripts/package-macos.sh, glob: "dist/*.dmg" }
          - { name: macos-x64, os: macos-15-intel, script: bash scripts/package-macos.sh, glob: "dist/*.dmg" }
          - { name: linux-x64, os: ubuntu-22.04, script: bash scripts/package-linux.sh, glob: "dist/*.AppImage" }
          - { name: linux-arm64, os: ubuntu-22.04-arm, script: bash scripts/package-linux.sh, glob: "dist/*.AppImage" }
    steps:
      - uses: actions/checkout@v7
      - name: rust toolchain
        run: rustup toolchain install
      - uses: oven-sh/setup-bun@v2
      - name: linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libfuse2 \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev
      - name: inno setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: release-${{ matrix.name }}
      # the script runs setup (runtime download pinned by runtime.lock.json), builds, packages and runs --self-test where it can
      - run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/desktop/${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum * > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
