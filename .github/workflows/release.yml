name: Release Desktop App

on:
  push:
    tags:
      - "v*"

# One release per tag; do not cancel mid-publish (assets would be partial).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"
  BUN_VERSION: "1.4.0"

jobs:
  # Version resolution + draft release only. The electron-vite build itself must run
  # on the target platform: build.bytecode emits V8 code cache (.jsc) via
  # v8.Script.createCachedData(), which is not portable across OS/arch and is
  # rejected at runtime with "cachedDataRejected".
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getVersion.outputs.value }}
      version_ok: ${{ steps.getVersion.outputs.ok }}
    steps:
      - if: github.ref_type == 'tag'
        id: getVersion
        uses: actions/github-script@v9
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const isVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const id = process.env.REF_NAME && process.env.REF_NAME.split('v')[1] || process.env.REF_NAME
            core.setOutput("value", id);
            core.setOutput("ok", String(isVersion.test(id)))

      # Avoid parallel pack jobs racing on release create.
      - name: Ensure draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          title="v${{ steps.getVersion.outputs.value }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --draft --title "$title" --notes "Publishing assets..."
          fi

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # outputs.version_ok is the string "true"/"false" - bare `if: ...` is truthy for "false".
      - if: github.ref_type == 'tag' && needs.prepare.outputs.version_ok == 'true'
        name: Set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-app-version.cjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile Electron app
        run: bun run release:compile
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify compile output
        shell: bash
        run: |
          test -f out/main/index.js
          test -f out/main/bytecode-loader.cjs

      - name: Pack Windows release
        run: bun run release:pack:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_RUNNER: windows-latest
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - if: github.ref_type == 'tag' && needs.prepare.outputs.version_ok == 'true'
        name: Set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-app-version.cjs

      - name: Install dependencies for macos arm64 runner
        run: bun install --frozen-lockfile --os darwin --cpu arm64

      - name: Compile Electron app
        run: bun run release:compile
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify compile output
        shell: bash
        run: |
          test -f out/main/index.js
          test -f out/main/bytecode-loader.cjs

      # Signing / notarization (disabled).
      # Secrets: MACOS_DEVELOPER_ID_APPLICATION_P12 (+ _PASSWORD),
      # APPLE_NOTARY_API_KEY_P8, APPLE_NOTARY_API_KEY_ID, APPLE_NOTARY_API_ISSUER_ID
      # - name: Prepare Apple notarization key
      #   run: |
      #     mkdir -p .secrets
      #     echo "${{ secrets.APPLE_NOTARY_API_KEY_P8 }}" > .secrets/AuthKey.p8
      #     chmod 600 .secrets/AuthKey.p8

      - name: Pack macOS release
        run: bun run release:pack:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_RUNNER: macos-latest
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # CSC_LINK: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}
          # APPLE_API_KEY: ${{ format('{0}/.secrets/AuthKey.p8', github.workspace) }}
          # APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          # APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}

      # - if: always()
      #   name: Cleanup Apple secrets
      #   run: rm -rf .secrets

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - if: github.ref_type == 'tag' && needs.prepare.outputs.version_ok == 'true'
        name: Set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-app-version.cjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile Electron app
        run: bun run release:compile
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify compile output
        shell: bash
        run: |
          test -f out/main/index.js
          test -f out/main/bytecode-loader.cjs

      - name: Pack Linux release
        run: bun run release:pack:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_RUNNER: ubuntu-latest
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

  finalize-release:
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "Tag=$tag Version=$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          prev=""
          if prev=$(gh release list --exclude-drafts --limit 20 --json tagName --jq ".[] | select(.tagName != \"$tag\") | .tagName" | head -n1); then
            :
          else
            prev=""
          fi

          if [ -z "$prev" ]; then
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          fi

          if [ -z "$prev" ]; then
            echo "No previous published release, listing all commits reachable from $tag"
            git log --pretty=tformat:"- %s (%h)" "$tag" > release-notes-commits.txt || true
          else
            echo "Commits: $prev..$tag"
            git log --pretty=tformat:"- %s (%h)" "$prev..$tag" > release-notes-commits.txt || true
          fi

          if [ ! -s release-notes-commits.txt ]; then
            echo "- No commits listed for this range." > release-notes-commits.txt
          fi

          {
            echo "## Changes"
            echo
            cat release-notes-commits.txt
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Set draft release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          gh release edit "$tag" \
            --draft \
            --title "v$version" \
            --notes-file release-notes.md
